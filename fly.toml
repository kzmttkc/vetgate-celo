# Optional: Fly.io deploy template. Primary hosting target is Vercel (see README).

app = "vetgate-celo"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  VETGATE_CELO_NETWORK = "mainnet"
  CELO_FACILITATOR_URL = "https://api.x402.celo.org"
  CELO_RPC_URL = "https://forno.celo.org"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1