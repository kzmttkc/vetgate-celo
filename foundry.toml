[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.default.fmt]
line_length = 120
# Deployed on Celo mainnet (0xde00...666c): keep the source byte-identical to what was compiled and deployed.
ignore = ["contracts/VetGatePayGuard.sol"]
